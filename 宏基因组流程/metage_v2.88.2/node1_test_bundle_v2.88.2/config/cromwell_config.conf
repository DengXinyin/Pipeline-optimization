include required(classpath("application"))

# Enable call-caching (断点续跑 / 结果复用)
call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

# 使用本地 docker daemon 计算镜像 hash，避免私有 registry 不被 Cromwell 支持导致 caching 被禁用
docker {
  hash-lookup {
    enabled = true
    method = "local"
  }
}

# Persist call-caching metadata across Cromwell restarts (file-based HSQLDB)
# This enables true restartability for the test workflow.
database {
  db.url = "jdbc:hsqldb:file:/home/xydeng/Metagenomics_Docker/metage_v2.88.2/cromwell-db/cromwell-db;shutdown=false;hsqldb.write_delay_millis=0"
  db.user = "SA"
  db.password = ""
  db.driver = "org.hsqldb.jdbcDriver"
  # 大型持久化 HSQLDB 在异常退出后的恢复可能超过默认 3 秒。
  # 延长 HikariCP 获取连接的等待时间，避免恢复尚未完成就关闭 Cromwell。
  db.connectionTimeout = 120000
  profile = "slick.jdbc.HsqldbProfile$"
}

backend {
  default = "Local"
  providers {
    Local {
      config {
        include required(classpath("reference_local_provider_config.inc.conf"))

        root = "/cephfs_data/genostack_v3/genostack_cromwell/cromwell-executions"
        dockerRoot = "/cromwell-executions"

        # Expose WDL runtime resources to the SFS submit-docker template.
        runtime-attributes = """
        Int cpu
        Int memory_gb
        String docker
        """

        submit-docker = """
        rm -f ${docker_cid}
        # 将 WDL runtime 的 cpu/memory 真正传给 Docker。
        # Cromwell 将 WDL 中的 "320 GB" 换算为 memory_gb=320。
        # 数据库使用 --mount：源路径不存在时直接报错，且以只读方式挂载。
        DOCKER_CPUS="${cpu}"
        DOCKER_MEMORY="${memory_gb}g"
        docker run \
          --cidfile ${docker_cid} \
          -i \
          --cpus "$DOCKER_CPUS" \
          --memory "$DOCKER_MEMORY" \
          -v /home/xydeng/Metagenomics_Docker/Input:/home/xydeng/Metagenomics_Docker/Input \
          -v /home/xydeng/Metagenomics_Docker/data:/home/xydeng/Metagenomics_Docker/data \
          -v /home/xydeng/Metagenomics_Docker/testdata:/home/xydeng/Metagenomics_Docker/testdata \
          --mount type=bind,src=/cephfs_data/genostack_v3/genostack_php/public_file_data/metagenome-DB,dst=/cephfs_data/genostack_v3/genostack_php/public_file_data/metagenome-DB,readonly \
          -v /public:/public \
          -v /home/xydeng/Metagenomics_Docker/metage_v2.88.2/scripts:/root/microbiome/microbiome/metage_v2.88.2:ro \
          -v /home/xydeng/Metagenomics_Docker/metage_v2.88.2/run-plans:/home/xydeng/Metagenomics_Docker/metage_v2.88.2/run-plans \
          -v /cephfs_data/genostack_v3/genostack_cromwell/cromwell-executions:/cephfs_data/genostack_v3/genostack_cromwell/cromwell-executions \
          --entrypoint ${job_shell} \
          -v ${cwd}:${docker_cwd}:delegated \
          ${docker} ${docker_script}

        rc=$(docker wait `cat ${docker_cid}`)
        docker rm `cat ${docker_cid}`
        exit $rc
        """

        kill-docker = "docker kill `cat ${docker_cid}`"

        default-runtime-attributes {
          cpu: 1
          memory: "2 GB"
          docker: "dockerhub.genostack.com/sanshu/metage:v2.88.2"
        }

        filesystems {
          local {
            localization: [
              "hard-link", "soft-link", "copy"
            ]
            caching {
              duplication-strategy: [
                "hard-link", "soft-link", "copy"
              ]
              hashing-strategy: "path"
              check-sibling-md5: false
            }
          }
        }
      }
    }
  }
}

# Workflow options defaults (can be overridden via -o options.json)
workflow-options {
  # Write workflow metadata with timestamps
  workflow-log-dir = "/home/xydeng/Metagenomics_Docker/metage_v2.88.2/cromwell-workflow-logs"
}
